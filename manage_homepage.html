<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>本部管理ダッシュボード | Admin POC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=JetBrains+Mono:wght@600;700&display=swap');

        :root {
            --bg-top: #f7f3ee;
            --bg-bottom: #f4f6fb;
            --primary: #1f3a5f;
            --primary-soft: #e6edf8;
            --accent: #d6a24a;
            --accent-soft: #f8edd7;
            --ink: #18212f;
            --muted: #6b7280;
            --line: rgba(148, 163, 184, 0.18);
            --danger: #b91c1c;
            --danger-soft: #fee2e2;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            -webkit-font-smoothing: antialiased;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(214, 162, 74, 0.14), transparent 26%),
                radial-gradient(circle at top right, rgba(31, 58, 95, 0.08), transparent 30%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid var(--line);
            box-shadow: 0 20px 50px rgba(24, 33, 47, 0.08);
        }

        .hero-card {
            background: linear-gradient(145deg, #162338 0%, #243754 48%, #4d3b26 100%);
            box-shadow: 0 24px 42px rgba(22, 35, 56, 0.28);
        }

        .hero-panel {
            background: rgba(9, 14, 24, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .hidden-view { display: none; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
        .animate-in { animation: fadeInUp 0.4s ease-out both; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tap-scale { transition: transform 0.18s ease; }
        .tap-scale:active { transform: scale(0.97); }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen" style="padding-bottom: calc(128px + env(safe-area-inset-bottom));">
    <div id="dashboard-view">
        <header class="sticky top-0 z-30 px-4 pt-4">
            <div class="glass-card rounded-[26px] px-4 py-4">
                <div class="flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <h1 class="text-lg font-extrabold tracking-wide truncate">本部管理ダッシュボード</h1>
                        <p class="text-[11px] text-slate-500 font-medium mt-1">加盟店・会員の総合管理</p>
                    </div>
                    <button onclick="admin.toast('監査ログはPOCのため簡略表示です')" class="w-10 h-10 rounded-full bg-white text-slate-500 border border-slate-200">
                        <i data-lucide="shield-check" class="w-5 h-5 mx-auto"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="px-4 pt-4 space-y-4" style="padding-bottom: calc(152px + env(safe-area-inset-bottom));">
            <section class="hero-card rounded-[30px] p-5 text-white relative overflow-hidden animate-in">
                <div class="absolute inset-0 bg-[linear-gradient(180deg,rgba(0,0,0,0.08),rgba(0,0,0,0.2))]"></div>
                <div class="absolute -right-12 -top-10 w-36 h-36 rounded-full bg-white/10 blur-3xl"></div>
                <div class="absolute -left-8 bottom-0 w-24 h-24 rounded-full bg-amber-300/10 blur-3xl"></div>
                <div class="relative">
                    <div class="flex items-start justify-between gap-3">
                        <div class="min-w-0">
                            <div class="text-[10px] uppercase tracking-[0.24em] text-white/65">HQ Console</div>
                            <div class="text-xl font-extrabold mt-2 leading-tight">共通ポイント運営本部</div>
                            <div class="text-[12px] text-white/75 mt-1 leading-5">会員の獲得経路、加盟店の保証金・運用状況を一元管理</div>
                        </div>
                        <div class="hero-panel rounded-full px-3 py-2 text-[10px] font-bold shrink-0">ADMIN POC</div>
                    </div>

                    <div class="mt-5 hero-panel rounded-[24px] p-4">
                        <div class="text-[10px] uppercase tracking-[0.24em] text-white/65">Today's Summary</div>
                        <div class="grid grid-cols-2 gap-3 mt-3">
                            <div>
                                <div class="text-[10px] text-white/60">付与総数</div>
                                <div id="summary-issued" class="text-2xl font-extrabold mt-1">0</div>
                            </div>
                            <div>
                                <div class="text-[10px] text-white/60">承認待ち</div>
                                <div id="summary-pending" class="text-2xl font-extrabold mt-1">0</div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 mt-4">
                        <div class="hero-panel rounded-2xl p-3">
                            <div class="text-[10px] text-white/65 leading-4">加盟店数</div>
                            <div id="stat-stores" class="mt-1 text-lg font-bold">0</div>
                        </div>
                        <div class="hero-panel rounded-2xl p-3">
                            <div class="text-[10px] text-white/65 leading-4">会員数</div>
                            <div id="stat-members" class="mt-1 text-lg font-bold">0</div>
                        </div>
                        <div class="hero-panel rounded-2xl p-3">
                            <div class="text-[10px] text-white/65 leading-4">要注意店</div>
                            <div id="stat-alerts" class="mt-1 text-lg font-bold">0</div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="grid grid-cols-2 gap-3 animate-in" style="animation-delay: 0.05s">
                <button onclick="switchTab('member')" class="glass-card rounded-[24px] p-4 text-left tap-scale">
                    <div class="w-11 h-11 rounded-2xl bg-[var(--primary-soft)] text-[var(--primary)] flex items-center justify-center mb-3">
                        <i data-lucide="users" class="w-5 h-5"></i>
                    </div>
                    <div class="text-sm font-bold">会員追跡</div>
                    <div class="text-[11px] text-slate-500 mt-1">いつ・どこで・どこから獲得したか確認</div>
                </button>
                <button onclick="switchTab('store')" class="glass-card rounded-[24px] p-4 text-left tap-scale">
                    <div class="w-11 h-11 rounded-2xl bg-[var(--accent-soft)] text-amber-700 flex items-center justify-center mb-3">
                        <i data-lucide="store" class="w-5 h-5"></i>
                    </div>
                    <div class="text-sm font-bold">加盟店管理</div>
                    <div class="text-[11px] text-slate-500 mt-1">保証金残高と店舗状態を確認</div>
                </button>
            </section>

            <section class="glass-card rounded-[28px] p-4 animate-in" style="animation-delay: 0.1s">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 class="text-sm font-extrabold">アクションセンター</h2>
                        <p class="text-[11px] text-slate-500 mt-1">本日対応したい案件を優先順に表示</p>
                    </div>
                    <span id="action-count" class="text-[11px] font-bold px-3 py-1 rounded-full bg-[var(--primary-soft)] text-[var(--primary)]">0件</span>
                </div>
                <div id="action-list" class="space-y-3"></div>
            </section>

            <section class="glass-card rounded-[28px] p-4 animate-in" style="animation-delay: 0.15s">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 class="text-sm font-extrabold">直近の監査ログ</h2>
                        <p class="text-[11px] text-slate-500 mt-1">加盟店・会員・本部操作の流れを確認</p>
                    </div>
                </div>
                <div id="audit-list" class="space-y-3"></div>
            </section>
        </main>
    </div>

    <div id="member-view" class="hidden-view">
        <header class="sticky top-0 z-30 px-4 pt-4">
            <div class="glass-card rounded-[26px] px-4 py-4">
                <h1 class="text-lg font-extrabold">会員追跡</h1>
                <p class="text-[11px] text-slate-500 mt-1">どこで、いつ、何由来でポイントを獲得したかを追跡</p>
                <div class="relative mt-4">
                    <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input id="member-search-input" type="text" placeholder="会員ID・氏名・流入元で検索" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-4 pl-11 pr-4 text-sm outline-none focus:border-[var(--primary)]">
                </div>
            </div>
        </header>
        <main class="px-4 pt-4 space-y-4" style="padding-bottom: calc(152px + env(safe-area-inset-bottom));">
            <div id="member-trace-list" class="space-y-4"></div>
        </main>
    </div>

    <div id="store-view" class="hidden-view">
        <header class="sticky top-0 z-30 px-4 pt-4">
            <div class="glass-card rounded-[26px] px-4 py-4">
                <h1 class="text-lg font-extrabold">加盟店管理</h1>
                <p class="text-[11px] text-slate-500 mt-1">保証金残高、利用枠、状態、対応メモを管理</p>
                <div class="relative mt-4">
                    <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input id="store-search-input" type="text" placeholder="店名・エリア・担当者で検索" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-4 pl-11 pr-4 text-sm outline-none focus:border-[var(--primary)]">
                </div>
            </div>
        </header>
        <main class="px-4 pt-4 space-y-4" style="padding-bottom: calc(152px + env(safe-area-inset-bottom));">
            <div id="store-manage-list" class="space-y-4"></div>
        </main>
    </div>

    <div id="alerts-view" class="hidden-view">
        <header class="sticky top-0 z-30 px-4 pt-4">
            <div class="glass-card rounded-[26px] px-4 py-4">
                <h1 class="text-lg font-extrabold">アラート</h1>
                <p class="text-[11px] text-slate-500 mt-1">閾値超過・残高低下・不自然な付与の検知</p>
            </div>
        </header>
        <main class="px-4 pt-4 space-y-4" style="padding-bottom: calc(152px + env(safe-area-inset-bottom));">
            <div id="alerts-list" class="space-y-4"></div>
        </main>
    </div>

    <nav class="fixed left-0 right-0 z-40 px-4" style="bottom: calc(12px + env(safe-area-inset-bottom));">
        <div class="glass-card rounded-[28px] px-4 py-3 min-h-[78px] flex items-center justify-around">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-[68px] flex flex-col items-center gap-1 text-[var(--primary)]">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">ホーム</span>
            </button>
            <button onclick="switchTab('member')" id="nav-member" class="w-[68px] flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="users" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">会員</span>
            </button>
            <button onclick="switchTab('store')" id="nav-store" class="w-[68px] flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="store" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">店舗</span>
            </button>
            <button onclick="switchTab('alerts')" id="nav-alerts" class="w-[68px] flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="triangle-alert" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">警告</span>
            </button>
        </div>
    </nav>

    <script>
        const STORAGE_KEY = 'hq_manage_dashboard_poc_v1';

        const createDefaultState = () => ({
            summary: {
                issuedToday: 5420,
                pending: 3
            },
            stores: [
                { id: 'TOKYO-001', name: '東京セントラル店', area: '東京', owner: '佐々木', depositBalance: 120000, pointPool: 84200, status: 'active', memo: '安定稼働', risk: 'low' },
                { id: 'OSAKA-014', name: '梅田ノース店', area: '大阪', owner: '中川', depositBalance: 42000, pointPool: 11800, status: 'warning', memo: '保証金補充が必要', risk: 'high' },
                { id: 'NAGOYA-006', name: '名古屋栄店', area: '名古屋', owner: '高橋', depositBalance: 85000, pointPool: 33000, status: 'review', memo: '付与増加を確認中', risk: 'medium' }
            ],
            members: [
                {
                    id: 'M-1001',
                    name: '田中 美咲',
                    total: 12400,
                    timeline: [
                        { date: '2026/05/15 10:10', store: '東京セントラル店', source: '来店特典', amount: 100 },
                        { date: '2026/05/15 09:40', store: '東京セントラル店', source: '購入キャンペーン', amount: 300 },
                        { date: '2026/05/10 18:40', store: '梅田ノース店', source: '週末フェア', amount: 500 }
                    ]
                },
                {
                    id: 'M-2034',
                    name: '鈴木 一真',
                    total: 8200,
                    timeline: [
                        { date: '2026/05/15 11:12', store: '名古屋栄店', source: '友達紹介', amount: 700 },
                        { date: '2026/05/13 13:28', store: '東京セントラル店', source: '通常還元', amount: 180 }
                    ]
                },
                {
                    id: 'M-3098',
                    name: '佐藤 七海',
                    total: 3100,
                    timeline: [
                        { date: '2026/05/14 18:22', store: '東京セントラル店', source: '来店特典', amount: 100 },
                        { date: '2026/05/09 16:02', store: '梅田ノース店', source: '購入キャンペーン', amount: 260 }
                    ]
                }
            ],
            actions: [
                { level: 'high', title: '梅田ノース店の保証金残高が閾値未満', note: '42,000pt / 補充推奨', action: '補充依頼' },
                { level: 'medium', title: '名古屋栄店で短時間付与が増加', note: '30分で7件 / 要確認', action: '監査確認' },
                { level: 'low', title: '新規加盟店の審査メモ更新', note: '福岡天神店の申請書が到着', action: '審査開始' }
            ],
            alerts: [
                { title: '保証金残高低下', detail: '梅田ノース店の保証金が運用下限を下回っています', severity: 'high' },
                { title: '不自然な付与パターン', detail: '名古屋栄店で同一ソースの連続付与を検知しました', severity: 'medium' },
                { title: '会員流入偏り', detail: '東京セントラル店で来店特典の比率が高くなっています', severity: 'low' }
            ],
            audits: [
                { type: 'member', text: 'M-1001 が 東京セントラル店 で 300pt 獲得', time: '2026/05/15 09:40' },
                { type: 'store', text: '梅田ノース店 の保証金補充依頼を作成', time: '2026/05/15 09:22' },
                { type: 'admin', text: '本部担当が 名古屋栄店 の監査フラグを確認', time: '2026/05/15 08:50' }
            ]
        });

        const state = (() => {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || createDefaultState();
            } catch (e) {
                return createDefaultState();
            }
        })();

        const views = {
            dashboard: document.getElementById('dashboard-view'),
            member: document.getElementById('member-view'),
            store: document.getElementById('store-view'),
            alerts: document.getElementById('alerts-view')
        };

        const navs = {
            dashboard: document.getElementById('nav-dashboard'),
            member: document.getElementById('nav-member'),
            store: document.getElementById('nav-store'),
            alerts: document.getElementById('nav-alerts')
        };

        const admin = {
            init() {
                this.save();
                this.renderSummary();
                this.renderActions();
                this.renderAudits();
                this.renderMembers();
                this.renderStores();
                this.renderAlerts();
                this.bindSearch();
                lucide.createIcons();
            },

            save() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            },

            toast(message) {
                alert(message);
            },

            renderSummary() {
                document.getElementById('summary-issued').textContent = this.formatNumber(state.summary.issuedToday);
                document.getElementById('summary-pending').textContent = state.summary.pending;
                document.getElementById('stat-stores').textContent = state.stores.length;
                document.getElementById('stat-members').textContent = state.members.length;
                document.getElementById('stat-alerts').textContent = state.alerts.length;
            },

            renderActions() {
                document.getElementById('action-count').textContent = `${state.actions.length}件`;
                document.getElementById('action-list').innerHTML = state.actions.map((item) => `
                    <div class="rounded-[24px] border p-4 ${this.actionStyle(item.level)}">
                        <div class="flex items-start justify-between gap-3">
                            <div class="min-w-0">
                                <div class="text-sm font-bold">${item.title}</div>
                                <div class="text-[11px] mt-1 ${item.level === 'high' ? 'text-rose-700' : 'text-slate-500'}">${item.note}</div>
                            </div>
                            <span class="shrink-0 rounded-full px-3 py-2 text-[10px] font-bold ${this.actionBadge(item.level)}">${item.action}</span>
                        </div>
                    </div>
                `).join('');
            },

            renderAudits() {
                document.getElementById('audit-list').innerHTML = state.audits.map((item) => `
                    <div class="rounded-[24px] bg-white border border-slate-100 p-4">
                        <div class="text-sm font-bold">${item.text}</div>
                        <div class="text-[11px] text-slate-500 mt-1">${item.time}</div>
                    </div>
                `).join('');
            },

            renderMembers(keyword = '') {
                const root = document.getElementById('member-trace-list');
                const filtered = state.members.filter((member) => {
                    if (!keyword) return true;
                    const target = `${member.id} ${member.name} ${member.timeline.map(t => `${t.store} ${t.source}`).join(' ')}`.toLowerCase();
                    return target.includes(keyword.toLowerCase());
                });

                root.innerHTML = filtered.map((member) => `
                    <div class="glass-card rounded-[28px] p-4">
                        <div class="flex items-start justify-between gap-3">
                            <div>
                                <div class="text-sm font-bold">${member.name}</div>
                                <div class="text-[11px] text-slate-500 mt-1">${member.id}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-[10px] text-slate-400">総ポイント</div>
                                <div class="text-sm font-extrabold mono">${this.formatNumber(member.total)} pt</div>
                            </div>
                        </div>
                        <div class="mt-4 space-y-3">
                            ${member.timeline.map((row) => `
                                <div class="rounded-2xl bg-slate-50 p-3">
                                    <div class="text-[11px] font-bold text-slate-800">${row.store}</div>
                                    <div class="text-[11px] text-slate-500 mt-1">${row.date}</div>
                                    <div class="flex items-center justify-between mt-2 gap-3">
                                        <span class="text-[11px] font-bold text-[var(--primary)]">${row.source}</span>
                                        <span class="text-[11px] font-extrabold text-slate-800">+${this.formatNumber(row.amount)} pt</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('') || `
                    <div class="glass-card rounded-[28px] p-6 text-center text-sm text-slate-500">
                        条件に合う会員が見つかりません
                    </div>
                `;
            },

            renderStores(keyword = '') {
                const root = document.getElementById('store-manage-list');
                const filtered = state.stores.filter((store) => {
                    if (!keyword) return true;
                    const target = `${store.id} ${store.name} ${store.area} ${store.owner}`.toLowerCase();
                    return target.includes(keyword.toLowerCase());
                });

                root.innerHTML = filtered.map((store) => `
                    <div class="glass-card rounded-[28px] p-4">
                        <div class="flex items-start justify-between gap-3">
                            <div>
                                <div class="text-sm font-bold">${store.name}</div>
                                <div class="text-[11px] text-slate-500 mt-1">${store.id} ・ ${store.area} ・ 担当 ${store.owner}</div>
                            </div>
                            <span class="rounded-full px-3 py-1 text-[10px] font-bold ${this.storeStatusStyle(store.status)}">${this.storeStatusLabel(store.status)}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mt-4">
                            <div class="rounded-2xl bg-slate-50 p-3">
                                <div class="text-[10px] text-slate-500">保証金残高</div>
                                <div class="text-sm font-extrabold mono mt-1">${this.formatNumber(store.depositBalance)} pt</div>
                            </div>
                            <div class="rounded-2xl bg-slate-50 p-3">
                                <div class="text-[10px] text-slate-500">店舗利用枠</div>
                                <div class="text-sm font-extrabold mono mt-1">${this.formatNumber(store.pointPool)} pt</div>
                            </div>
                        </div>
                        <div class="mt-3 rounded-2xl ${store.risk === 'high' ? 'bg-rose-50 text-rose-700' : store.risk === 'medium' ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700'} p-3 text-[11px] font-bold">
                            ${store.memo}
                        </div>
                        <div class="grid grid-cols-2 gap-3 mt-3">
                            <button class="rounded-2xl bg-[var(--primary)] py-3 text-white text-[11px] font-bold tap-scale">詳細確認</button>
                            <button class="rounded-2xl bg-[var(--accent-soft)] py-3 text-amber-700 text-[11px] font-bold tap-scale">残高調整</button>
                        </div>
                    </div>
                `).join('') || `
                    <div class="glass-card rounded-[28px] p-6 text-center text-sm text-slate-500">
                        条件に合う加盟店が見つかりません
                    </div>
                `;
            },

            renderAlerts() {
                document.getElementById('alerts-list').innerHTML = state.alerts.map((item) => `
                    <div class="glass-card rounded-[28px] p-4 border ${item.severity === 'high' ? 'border-rose-200' : item.severity === 'medium' ? 'border-amber-200' : 'border-slate-200'}">
                        <div class="flex items-start gap-3">
                            <div class="w-11 h-11 rounded-2xl ${item.severity === 'high' ? 'bg-rose-100 text-rose-700' : item.severity === 'medium' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600'} flex items-center justify-center shrink-0">
                                <i data-lucide="triangle-alert" class="w-5 h-5"></i>
                            </div>
                            <div class="min-w-0">
                                <div class="text-sm font-bold">${item.title}</div>
                                <div class="text-[11px] text-slate-500 mt-1">${item.detail}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            },

            bindSearch() {
                document.getElementById('member-search-input').addEventListener('input', (e) => this.renderMembers(e.target.value.trim()));
                document.getElementById('store-search-input').addEventListener('input', (e) => this.renderStores(e.target.value.trim()));
            },

            actionStyle(level) {
                if (level === 'high') return 'border-rose-200 bg-rose-50';
                if (level === 'medium') return 'border-amber-200 bg-amber-50';
                return 'border-slate-200 bg-slate-50';
            },

            actionBadge(level) {
                if (level === 'high') return 'bg-rose-100 text-rose-700';
                if (level === 'medium') return 'bg-amber-100 text-amber-700';
                return 'bg-slate-100 text-slate-700';
            },

            storeStatusStyle(status) {
                if (status === 'warning') return 'bg-rose-100 text-rose-700';
                if (status === 'review') return 'bg-amber-100 text-amber-700';
                return 'bg-emerald-100 text-emerald-700';
            },

            storeStatusLabel(status) {
                if (status === 'warning') return '要補充';
                if (status === 'review') return '確認中';
                return '正常';
            },

            formatNumber(value) {
                return Number(value || 0).toLocaleString('ja-JP');
            }
        };

        function switchTab(target) {
            Object.keys(views).forEach((key) => {
                views[key].classList.toggle('hidden-view', key !== target);
                if (navs[key]) {
                    navs[key].classList.toggle('text-[var(--primary)]', key === target);
                    navs[key].classList.toggle('text-slate-400', key !== target);
                }
            });
            window.scrollTo(0, 0);
            lucide.createIcons();
        }

        window.onload = () => {
            admin.init();
        };
    </script>
</body>
</html>
