<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POC システムナビゲーションポータル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .nav-button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="max-w-4xl w-full py-12">
        <header class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-800 mb-6 tracking-tight">
                POC デモシステム
            </h1>
            <p class="text-lg text-gray-600">
                プレビューするビジネスモジュールを選択してください
            </p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <a href="store_homepage.html" class="nav-button group block">

                    <div class="w-16 h-16 bg-blue-500 rounded-2xl flex items-center justify-center mb-6 text-white shadow-lg group-hover:bg-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                        </svg>
                    </div>

                        店舗のフロントエンド展示とインタラクションを確認します。
                    </p>
                    <span class="mt-auto pt-6 text-blue-600 font-bold flex items-center group-hover:underline">
                        モジュールに入る 
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </span>
                </div>
            </a>

            <a href="member_homepage.html" class="nav-button group block">
                <div class="glass-card rounded-2xl p-8 h-full flex flex-col items-center text-center">
                    <div class="w-16 h-16 bg-purple-500 rounded-2xl flex items-center justify-center mb-6 text-white shadow-lg group-hover:bg-purple-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>

                    <p class="text-sm text-gray-500 leading-relaxed">
                        マイページ、会員特典、およびプロフィール管理を確認します。
                    </p>
                    <span class="mt-auto pt-6 text-purple-600 font-bold flex items-center group-hover:underline">
                        モジュールに入る 
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </span>
                </div>
            </a>

            <a href="manage_homepage.html" class="nav-button group block">
                <div class="glass-card rounded-2xl p-8 h-full flex flex-col items-center text-center">
                    <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mb-6 text-white shadow-lg group-hover:bg-indigo-700 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                        </svg>
                    </div>

                    <p class="text-sm text-gray-500 leading-relaxed">
                        店舗データと会員情報を一元管理するバックエンドです。
                    </p>
                    <span class="mt-auto pt-6 text-indigo-600 font-bold flex items-center group-hover:underline">
                        モジュールに入る 
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </span>
                </div>

        </div>

        <footer class="mt-20 text-center text-gray-400 text-xs">
            <p>© 2024 POC デモポータル - 各 HTML ファイルを同一ディレクトリ内に配置してください。</p>
        </footer>
    </div>

</html>
